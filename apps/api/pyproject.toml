[project]
name = "roster-converter-api"
version = "0.1.0"
description = "FastAPI backend for the roster converter monorepo."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "ruff>=0.9,<1.0",
  "pandas>=2.2,<3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
